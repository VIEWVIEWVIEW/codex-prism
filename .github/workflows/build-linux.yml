name: Build Linux

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to build (empty for a test build)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 26.04 x64 packages
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget build-essential pkg-config python3 \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            librsvg2-bin patchelf squashfs-tools libssl-dev libpng-dev \
            zlib1g-dev file xdg-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up pnpm and Rust
        run: |
          corepack enable
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.88.0
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          corepack pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates/prism-core -> target
            apps/desktop/src-tauri -> target
      - name: Validate release version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release.mjs check "$RELEASE_TAG"
      - name: Test release tooling, frontend and backend
        run: |
          corepack pnpm test:release
          corepack pnpm --filter @codex-prism/desktop test
          cargo test --locked --manifest-path crates/prism-core/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Build and validate Debian package and AppImage
        run: corepack pnpm release:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-prism-linux-x64
          path: dist/releases/v*/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

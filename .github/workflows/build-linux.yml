name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main, feat/windows-installer]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'apps/desktop/**'
      - 'crates/prism-core/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'apps/desktop/**'
      - 'crates/prism-core/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu x64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Linux build and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb \
            texlive-latex-extra texlive-publishers texlive-fonts-recommended \
            texlive-xetex texlive-luatex texlive-bibtex-extra biber ghostscript
          corepack enable
          rustup toolchain install 1.88.0 --profile minimal
          corepack pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates/prism-core -> target
            apps/desktop/src-tauri -> target
      - name: Test frontend and backend
        run: |
          corepack pnpm --filter @codex-prism/desktop test
          cargo test --locked --manifest-path crates/prism-core/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Test real LaTeX and PDF export
        run: |
          cargo test --locked --manifest-path crates/prism-core/Cargo.toml texlive_integration -- --ignored --skip texlive_integration_project_copy --test-threads=1
          cargo test --locked --manifest-path crates/prism-core/Cargo.toml optimizes_real_pdf_without_changing_input_and_cleans_up -- --ignored
          cargo test --locked --manifest-path crates/prism-core/Cargo.toml project_service_pdf_roundtrip -- --ignored
      - name: Build Debian package
        run: |
          corepack pnpm --filter @codex-prism/desktop tauri build --bundles deb \
            --config src-tauri/tauri.local-build.conf.json -- --locked
      - name: Install package and check startup
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get install -y ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          binary=$(command -v codex-prism)
          ldd "$binary" | tee linux-linkage.log
          if grep -q 'not found' linux-linkage.log; then exit 1; fi
          set +e
          timeout --signal=TERM 15s xvfb-run -a "$binary" > linux-startup.log 2>&1
          startup_status=$?
          set -e
          cat linux-startup.log
          # The GUI must remain running until timeout terminates the smoke test.
          test "$startup_status" -eq 124
      - name: Checksum package
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/deb
          sha256sum ./*.deb > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-prism-ubuntu-x64
          path: apps/desktop/src-tauri/target/release/bundle/deb/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-prism-ubuntu-diagnostics
          path: |
            linux-linkage.log
            linux-startup.log
          if-no-files-found: ignore
